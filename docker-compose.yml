services:
  postgres:
    image: pgvector/pgvector:pg16 # CRITICAL: not postgres:16 — vector extension included
    environment:
      POSTGRES_DB: jyapasa
      POSTGRES_USER: jyapasa
      POSTGRES_PASSWORD: jyapasa_pass
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jyapasa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5

volumes:
  postgres_data:
